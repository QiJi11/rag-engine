<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Engine Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a2e; --panel: #16213e; --card: #0f3460;
    --accent: #e94560; --text: #eaeaea; --muted: #888;
    --border: #2a2a4a; --user-bubble: #0f3460; --bot-bubble: #1e1e3a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Top bar */
  header { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  .rag-toggle { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 0.85rem; color: var(--muted); }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #333; border-radius: 24px; cursor: pointer; transition: .3s; }
  .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: .3s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(20px); }

  /* Main layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Left panel */
  aside { width: 280px; min-width: 240px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow-y: auto; }
  aside h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  .upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 24px 12px;
    text-align: center; cursor: pointer; transition: border-color .2s; }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); }
  .upload-zone svg { width: 32px; height: 32px; color: var(--muted); margin-bottom: 8px; }
  .upload-zone p { font-size: 0.8rem; color: var(--muted); }
  .upload-zone strong { display: block; font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
  #file-input { display: none; }

  #upload-status { font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; display: none; }
  #upload-status.ok { background: #1a3a2a; color: #4caf50; }
  #upload-status.err { background: #3a1a1a; color: #f44336; }

  #doc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #doc-list li { font-size: 0.82rem; background: var(--card); padding: 8px 10px; border-radius: 6px;
    color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #doc-list li::before { content: '📄'; font-size: 0.9rem; }
  #no-docs { font-size: 0.82rem; color: var(--muted); font-style: italic; }

  /* Chat panel */
  section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 0.8rem; flex-shrink: 0; }
  .msg.user .avatar { background: var(--accent); }
  .msg.bot .avatar { background: var(--card); }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; word-break: break-word; }
  .msg.user .bubble { background: var(--user-bubble); border-top-right-radius: 2px; }
  .msg.bot .bubble { background: var(--bot-bubble); border-top-left-radius: 2px; }
  .bubble.thinking { color: var(--muted); font-style: italic; }

  /* Input bar */
  .input-bar { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #query-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; color: var(--text); font-size: 0.9rem; resize: none; outline: none;
    font-family: inherit; line-height: 1.4; max-height: 120px; }
  #query-input:focus { border-color: var(--accent); }
  #send-btn { background: var(--accent); border: none; border-radius: 10px; padding: 0 18px;
    color: #fff; font-size: 0.9rem; cursor: pointer; transition: opacity .2s; white-space: nowrap; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🔍 RAG Engine</h1>
  <span style="font-size:0.8rem;color:var(--muted)">上传文档 → 问问题 → AI 从文档中找答案</span>
  <div class="rag-toggle">
    <span>RAG</span>
    <label class="switch">
      <input type="checkbox" id="rag-switch" checked>
      <span class="slider"></span>
    </label>
  </div>
</header>

<main>
  <aside>
    <div>
      <h2 style="margin-bottom:10px">上传文档</h2>
      <div class="upload-zone" id="upload-zone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16v-8m0 0-3 3m3-3 3 3M6 20h12a2 2 0 002-2V8l-6-6H6a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
        <strong>点击或拖拽上传</strong>
        <p>支持 .txt 文件</p>
      </div>
      <input type="file" id="file-input" accept=".txt">
      <div id="upload-status"></div>
    </div>

    <div>
      <h2 style="margin-bottom:10px">知识库</h2>
      <ul id="doc-list"></ul>
      <p id="no-docs">暂无文档</p>
    </div>
  </aside>

  <section>
    <div id="messages">
      <div class="msg bot">
        <div class="avatar">🤖</div>
        <div class="bubble">你好！请先在左侧上传文档，然后向我提问，我会从文档中检索相关内容来回答。</div>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="query-input" rows="1" placeholder="输入问题，按 Enter 发送…"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </section>
</main>

<script>
const API = 'http://localhost:8000/api/v1';

// --- Upload ---
const zone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');
const status = document.getElementById('upload-status');

zone.addEventListener('click', () => fileInput.click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

async function handleFile(file) {
  if (!file) return;
  showStatus('上传中…', '');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '上传失败');
    showStatus(`✓ ${d.filename}（${d.chunks_count} 块）`, 'ok');
    loadDocs();
  } catch (e) {
    showStatus('✗ ' + e.message, 'err');
  }
}

function showStatus(msg, cls) {
  status.textContent = msg;
  status.className = cls;
  status.style.display = 'block';
  if (cls) setTimeout(() => { status.style.display = 'none'; }, 4000);
}

async function loadDocs() {
  try {
    const r = await fetch(`${API}/docs`);
    const d = await r.json();
    const list = document.getElementById('doc-list');
    const none = document.getElementById('no-docs');
    list.innerHTML = '';
    if (d.sources && d.sources.length) {
      none.style.display = 'none';
      d.sources.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        list.appendChild(li);
      });
    } else {
      none.style.display = '';
    }
  } catch {}
}

loadDocs();

// --- Chat ---
const messages = document.getElementById('messages');
const input = document.getElementById('query-input');
const sendBtn = document.getElementById('send-btn');
const ragSwitch = document.getElementById('rag-switch');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

function addMsg(text, role, cls = '') {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = `bubble ${cls}`;
  bubble.textContent = text;
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

async function sendMessage() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;

  addMsg(q, 'user');
  const thinking = addMsg('思考中…', 'bot', 'thinking');

  try {
    const r = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, use_rag: ragSwitch.checked }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '请求失败');
    thinking.textContent = d.content;
    thinking.classList.remove('thinking');
  } catch (e) {
    thinking.textContent = '错误：' + e.message;
    thinking.style.color = '#f44336';
    thinking.classList.remove('thinking');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
